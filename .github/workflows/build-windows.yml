name: Build Windows executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'          # triggers on tags like v2.0.0, v2.1.0, v3.0.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller BREAKPOINT_REFACTORING_TOOL.spec

      - name: Upload artifact (for all pushes)
        uses: actions/upload-artifact@v4
        with:
          name: BREAKPOINT_REFACTORING_TOOL_V2-windows
          path: dist/BREAKPOINT_REFACTORING_TOOL_V2/
          retention-days: 30

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BREAKPOINT_REFACTORING_TOOL_V2/* -DestinationPath BREAKPOINT_REFACTORING_TOOL_V2.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BREAKPOINT_REFACTORING_TOOL_V2.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}